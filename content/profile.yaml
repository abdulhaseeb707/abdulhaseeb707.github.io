# ─── The research paper ─────────────────────────────────────────────────────
research:
  slug: inflation-profitability
  title: Inflation and Corporate Profitability in Pakistan, FY2006–FY2025
  paperTitle: "Inflation and the Profitability of Listed Non-Financial Firms in Pakistan: Firm-Level Panel Evidence, FY2006–FY2025"
  status: Working paper, 2026. Not peer reviewed.
  tagline: How the profits of Pakistan's listed companies have moved with inflation over twenty years.
  teaser: Operating profit grew 6.4 times in rupees. In real terms it ended *3% lower*.
  origin: It started as a Stata project at university in 2025. In 2026 I rebuilt it in Python with twenty years of data.
  moonCaption: 6,683 dots, one for every firm-year in this study.
  stats:
    - figure: "441"
      text: listed firms
    - figure: "6,683"
      text: firm-years
    - figure: "20"
      text: fiscal years
    - figure: "14"
      text: sectors
  # the six scroll steps on the research page; each one changes the chart
  story:
    - title: The question
      text: Pakistan's inflation went from 2.9% in FY2016 to 29.2% in FY2023. I wanted to know what that did to company profits.
    - title: The data
      text: I built a panel from State Bank of Pakistan company accounts. 441 non-financial firms in 14 sectors, 6,683 firm-years, each matched to inflation over its own financial year.
    - title: Rupees vs real
      text: Aggregate operating profit grew 6.4 times in rupees. Deflated by the CPI, it ended about 3% below its FY2006 level.
    - title: The 10% bend
      text: Up to about 10% inflation, return on assets rises 0.48 points per point of inflation. Above it, the slope is flat. The bend holds for every threshold from 6% to 15%.
    - title: Sectors
      text: Sugar, mineral products, electrical machinery, fuel and energy, and chemicals show clearly positive slopes. Cement and autos show none.
    - title: The trap
      text: With ordinary firm-clustered errors, the average effect looks highly significant. Errors that allow for shocks hitting every firm at once say it isn't.
  implications:
    - Judge performance in inflationary years by real profits, not only by nominal ratios.
    - Exposure to inflation is mostly a sector question.
    - Above roughly 10% inflation, measured profitability stopped improving.
  limitations: These are associations from observational data, over twenty years with two big inflation episodes. Accounting changes and the use of the CPI rather than producer prices are documented limits.
  links:
    - label: Read the paper
      note: PDF, 21 pages
      url: https://github.com/abdulhaseeb707/inflation-corporate-profitability-pakistan/blob/main/reports/research_paper.pdf
    - label: Two-page summary
      note: PDF
      url: https://github.com/abdulhaseeb707/inflation-corporate-profitability-pakistan/blob/main/reports/executive_summary.pdf
    - label: Slides
      note: PDF, 11 slides
      url: https://github.com/abdulhaseeb707/inflation-corporate-profitability-pakistan/blob/main/presentation/inflation_profitability_pakistan.pdf
    - label: Code and data notes
      note: GitHub
      url: https://github.com/abdulhaseeb707/inflation-corporate-profitability-pakistan
  did:
    - Harmonised three State Bank of Pakistan Excel releases with different layouts and year conventions into one firm-year panel
    - Matched company accounts to monthly IMF CPI data using each firm's own year-end month
    - "Panel econometrics in Python: fixed effects, Driscoll–Kraay standard errors, wild cluster bootstrap, a threshold model and sector-specific slopes"
    - Wrote a 21-page working paper, a technical report, an executive summary and an 11-slide deck
    - Kept the whole pipeline reproducible from raw data with one command (uv, Python 3.15)
  tags: [Python, pandas, statsmodels, linearmodels, matplotlib, Econometrics, Panel data, Macroeconomics, Corporate finance, Pakistan]

