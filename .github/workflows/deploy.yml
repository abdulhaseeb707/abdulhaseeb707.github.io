name: Send the old github.io address to abdulhaseebkhan.online

# The site itself runs on the Oracle server (see DEPLOY-ORACLE.md). GitHub Pages for this repo
# (abdulhaseeb707.github.io) only publishes deploy/github-pages/: a page that forwards every address
# to the same page on https://abdulhaseebkhan.online (404.html catches the paths that don't exist here).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - name: Use the forwarding page for every missing path too
        run: cp deploy/github-pages/index.html deploy/github-pages/404.html

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: deploy/github-pages

      - id: deployment
        uses: actions/deploy-pages@v5
