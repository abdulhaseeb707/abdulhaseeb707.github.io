# ─── The research paper (the main feature on the home page) ────────────────
research:
  slug: inflation-profitability
  title: Inflation and Corporate Profitability in Pakistan, FY2006–FY2025
  paperTitle: "Inflation and the Profitability of Listed Non-Financial Firms in Pakistan: Firm-Level Panel Evidence, FY2006–FY2025"
  status: Working paper, 2026. Not peer reviewed.
  tagline: How the profits of Pakistan's listed companies have moved with inflation over twenty years.
  origin: It started as a Stata project at university in 2025. In 2026 I rebuilt it in Python with twenty years of data.
  stats:
    - figure: "441"
      text: listed firms
    - figure: "6,683"
      text: firm-years
    - figure: "20"
      text: fiscal years
    - figure: "14"
      text: sectors
  # big number + one short line each
  findings:
    - figure: "10%"
      text: Where it bends. Below it, profitability rises with inflation. Above it, the gains stop.
    - figure: "6.4×"
      text: Growth in operating profit in rupees. In real terms it ended about 3% lower.
    - figure: "+0.39"
      text: Sugar's slope, the highest of any sector. Cement and autos show no gain.
    - figure: "p = 0.27"
      text: No reliable average link once shocks that hit every firm in the same year are allowed for.
  figures:
    - tab: Rupees vs real
      src: research/fig4_nominal_vs_real_operating_profit.png
      alt: Line chart of aggregate operating profit from FY2006 to FY2025, indexed to 100. The nominal line rises to about 640 while the inflation-adjusted line ends slightly below 100.
      caption: Operating profit grew 6.4 times in rupees but ended about 3% lower in real terms.
    - tab: The 10% bend
      src: research/fig5_median_roa_vs_inflation.png
      alt: Scatter of median return on assets against fiscal-year inflation, FY2006 to FY2025, with the relationship flattening above about 10% inflation.
      caption: Median return on assets against inflation, one point per fiscal year.
    - tab: By sector
      src: research/fig8_sector_inflation_slopes.png
      alt: Bar chart of the inflation and return-on-assets slope by sector, highest for sugar and lowest for cement and autos.
      caption: How strongly each sector's profitability moves with inflation.
    - tab: Inflation since 2006
      src: research/fig1_inflation_fy.png
      alt: Line chart of Pakistan's fiscal-year CPI inflation from FY2006 to FY2025, peaking at 29.2% in FY2023.
      caption: Pakistan's inflation went from 2.9% in FY2016 to 29.2% in FY2023.
  # the slider explainer: slope of ROA per point of inflation, below and above the kink
  kink:
    at: 10
    below: 0.48
    above: -0.05
    from: 3
    to: 29
  links:
    - label: Read the paper
      note: PDF, 21 pages
      url: https://github.com/abdulhaseeb707/inflation-corporate-profitability-pakistan/blob/main/reports/research_paper.pdf
    - label: Two-page summary
      note: PDF
      url: https://github.com/abdulhaseeb707/inflation-corporate-profitability-pakistan/blob/main/reports/executive_summary.pdf
    - label: Slides
      note: PDF, 11 slides
      url: https://github.com/abdulhaseeb707/inflation-corporate-profitability-pakistan/blob/main/presentation/inflation_profitability_pakistan.pdf
    - label: Code and data notes
      note: GitHub
      url: https://github.com/abdulhaseeb707/inflation-corporate-profitability-pakistan
  # the longer text on the research page
  page:
    - Pakistan's inflation went from 2.9% in FY2016 to 29.2% in FY2023, and I wanted to know what that did to company profits. Using twenty years of State Bank of Pakistan company accounts, I built a panel of 441 non-financial firms (6,683 firm-years) and matched each one to inflation over its own reporting year.
    - On average, inflation isn't reliably linked to return on assets once you allow for shocks that hit every firm in the same year. But the relationship bends. Profitability rises with inflation up to about 10%, then stops improving. Sugar, minerals, electrical machinery, energy and chemicals did better than other sectors, while cement and autos didn't. And although operating profit grew 6.4 times in rupees, in real terms it ended slightly below where it started.
  exact:
    - "No robust average link: ROA is +0.14 percentage points higher per point of inflation, which isn't significant once common shocks are allowed for (wild cluster bootstrap p = 0.27)."
    - "A kink at about 10% inflation: +0.48 pp per point below 10%, flat above it (−0.05). The change in slope is robust (bootstrap p = 0.006) and holds for every threshold from 6% to 15%."
    - "Sector slopes: sugar +0.39, mineral products +0.28, electrical machinery +0.27, fuel and energy +0.25, chemicals and pharmaceuticals +0.20. Cement and automobiles show no gain."
    - "Nominal vs real: aggregate operating profit grew 6.4× in rupees, but real (CPI-deflated) operating profit ended about 3% below its FY2006 level."
    - "Methods: ordinary firm-clustered standard errors make the average effect look highly significant (p < 0.001), but Driscoll–Kraay errors and the bootstrap don't."
  did:
    - Harmonised three State Bank of Pakistan Excel releases with different layouts and year conventions into one firm-year panel
    - Matched company accounts to monthly IMF CPI data using each firm's own year-end month
    - "Panel econometrics in Python: fixed effects, Driscoll–Kraay standard errors, wild cluster bootstrap, a threshold model and sector-specific slopes"
    - Wrote a 21-page working paper, a technical report, an executive summary and an 11-slide deck
    - Kept the whole pipeline reproducible from raw data with one command (uv, Python 3.15)
  tags: [Python, pandas, statsmodels, linearmodels, matplotlib, Econometrics, Panel data, Macroeconomics, Corporate finance, Pakistan]

