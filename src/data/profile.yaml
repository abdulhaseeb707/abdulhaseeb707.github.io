    date: 2021-12-15
    when: December 2021
    place: Lahore
    map: lahore
    category: study
    title: Choosing economics
    summary: >-
      In December 2021 I started a BS in Business Economics at the University of the Punjab. Before that
      I had studied ICS (computer science, statistics and mathematics) at the Government College of
      Science, so I came in with numbers already part of my toolkit.
    story: |-
      Over the next four and a half years I worked through micro and macroeconomics, statistics,
      Econometrics I and II, Calculus I and II, accounting and finance, marketing, quantitative decision
      science, data visualization, industrial economics, Islamic banking and finance, and a course on
      Pakistan's own economic problems.

      Econometrics and quantitative decision science gave me the tools for the projects further down this
      page.
    cv:
