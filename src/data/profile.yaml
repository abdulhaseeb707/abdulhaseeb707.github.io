  - id: festival
    date: 2026-09-11
    when: 11 – 17 September 2026
    place: Ekaterinburg, Russia
    map: ekaterinburg
    category: international
    title: 10,000 people, 191 countries
    summary: >-
      I was one of 10,000 young people from 191 countries at the International Festival of Youth 2026 in
      Ekaterinburg. I joined the Entrepreneurship Track, spoke for Pakistan in the Interactive International
      Discussion on financial fraud, and presented my work on what fraud costs Pakistan's economy.
    story: |-
      On 16 September I presented "Financial Fraud in Pakistan and Losses to GDP" at the festival's Znanie
      stage. In the Interactive International Discussion I set out Pakistan's problems with financial fraud
      and the solutions young people are working on.

      At the festival I also became a member of the International Movement on Financial Security. Between
      sessions I walked the flag plaza of the World Youth City, met participants from many continents, and saw Russian technology up close: a humanoid robot from the Alabuga special economic
      zone, Kaspersky's model of a cyber-protected industrial city, and neurotechnology demonstrations.
