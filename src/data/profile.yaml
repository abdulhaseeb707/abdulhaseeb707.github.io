  - id: coursera
    date: 2023-06-26
    when: June 2023
    place: Online
    map: online
    category: study
    title: A course from Illinois
    summary: >-
      I completed Firm Level Economics: Consumer and Producer Behavior, an online course from the
      University of Illinois Urbana-Champaign.
    story: |-
      It covered how taxes and price controls move a market's equilibrium, how elasticity of demand shapes
      what consumers do, and how a firm picks its output to maximise profit at given prices.
