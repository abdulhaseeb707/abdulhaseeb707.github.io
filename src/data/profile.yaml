        caption: "28 September: just landed in Krasnoyarsk."
      - src: photos/iofs-2025-podium.jpg
        alt: Abdul Haseeb Khan speaking at a podium on a blue-lit stage, with the olympiad's session title on the screen behind him.
        caption: "1 October: at the podium."
      - src: photos/iofs-2025-press-wall.jpg
        alt: Abdul Haseeb Khan in a white fur hat and the olympiad vest in front of the olympiad's press wall.
        caption: The Siberian welcome came with a hat.
      - src: photos/iofs-2025-medal-and-kit.jpg
        alt: A desk with the olympiad medal, a student badge reading Khan Abdul Haseeb, a certificate, lanyards, notebooks and a fur hat.
        caption: What I brought home.
    evidence:
