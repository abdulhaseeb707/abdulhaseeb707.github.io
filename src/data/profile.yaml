# ─────────────────────────────────────────────────────────────────────────────
#  THE ONE FILE TO EDIT
#  Everything on the website AND in the CV PDF comes from this file
#  (plus the long project stories in src/content/projects/).
#
#  - Website text is first person ("I…"), told as a story in time order.
#  - CV text (every `cv:` block) is CV style: action verbs, no "I".
#  - Only write what you can prove. See AGENTS.md.
#  - Photos/certificates are paths inside src/assets/ (e.g. photos/portrait.jpg).
#  - Files in public/ are linked as /files/name.pdf.
#  - After saving, push to GitHub: the site and the CV rebuild by themselves.
# ─────────────────────────────────────────────────────────────────────────────

