        alt: Abdul Haseeb Khan on stage holding Pakistan's flag and his diploma, next to an official, under a screen reading Economic Security.
        caption: Receiving my diploma on stage, with Pakistan's flag.
      - src: photos/iofs-2025-arrival-krasnoyarsk.jpg
