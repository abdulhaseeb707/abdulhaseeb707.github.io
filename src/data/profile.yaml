  - id: solver
    date: 2025-02-04
    when: February – May 2025
    place: Lahore
    map: lahore
    category: research
    title: Solving a cost problem with Excel Solver
    summary: >-
      I built a linear programming model in Excel Solver to find the cheapest production plan that still
      met the required output and stayed inside the available resources.
    story: |-
      I set up the decision variables, wrote the cost to be minimised and the constraints it had to respect,
      then let Solver find the optimum and read the result back as an operating decision.
    project: cost-optimization-solver
    cv:
      - section: projects
        title: Operational Cost Optimization Model
        dates: Feb – May 2025
        bullets:
          - "Built a linear programming model in Excel Solver to minimise production costs under output and resource constraints"
          - "Applied operational research techniques to a real-world economic decision problem"

  - id: inflation
    date: 2025-05-05
    when: May – August 2025
    place: Lahore
    map: lahore
    category: research
    title: Does inflation eat into company profits?
    summary: >-
      I ran a regression study in Stata on how inflation relates to the profitability of firms, using
      company financial data.
    story: |-
      The question was simple: when prices rise, what happens to company profits? I worked with company
      financial data, wrote my hypotheses and estimated multiple regression models in Stata, then read the
      results for what they meant for businesses and for price stability.
    project: inflation-profitability
    cv:
      - section: projects
        title: "Inflation and Corporate Profitability: An Econometric Analysis"
        dates: May – Aug 2025
        bullets:
          - "Investigated the relationship between inflation and firm-level profitability using company financial data"
          - "Estimated multiple regression models in Stata to test hypotheses and interpret the economic relationships"
          - "Drew evidence-based conclusions for the business environment and price-stability policy"

  - id: iofs
    date: 2025-09-28
    when: 28 September – 3 October 2025
    place: Krasnoyarsk, Russia
    map: krasnoyarsk
    category: international
    title: Siberia, with Pakistan's flag
    summary: >-
      I travelled to Krasnoyarsk to represent Pakistan at the V International Olympiad on Financial Security,
      hosted by Siberian Federal University. I came home with a Diploma (II degree) in Economics.
    story: |-
      The olympiad brings students from many countries together to solve cases on anti-money laundering,
      countering the financing of terrorism, economic risk and financial compliance. I competed in the
      Economics field.

      On 1 October I spoke at the podium in the session on studying financial security and AML/CFT in
      Russia. At the closing ceremony I walked on stage with Pakistan's flag to receive my diploma. The
      result also brought a 50% scholarship toward master's studies.
    photos:
